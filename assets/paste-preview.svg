<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Paste clipboard manager interface</title>
  <desc id="desc">A dark macOS app window with a sidebar, search field and colorful clipboard cards.</desc>
  <defs>
    <linearGradient id="page" x1="80" y1="20" x2="1320" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B1235"/>
      <stop offset=".5" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#211038"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
